<div class="cart-overlay" (click)="closeCart()">
  <div class="cart-sidebar" (click)="$event.stopPropagation()">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-button" (click)="closeCart()">&times;</button>
    </div>

    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <p>Your cart is currently empty.</p>
      <button (click)="closeCart()" class="button" style="margin-top: 20px">
        Continue Shopping
      </button>
    </div>

    <div *ngIf="cartItems.length > 0">
      <div *ngFor="let item of cartItems" class="cart-item">
        <div class="cart-item-info">
          <h3>{{ item.bike.name }}</h3>
          <p>Price: {{ item.bike.price | currency }}</p>
          <p>Quantity: {{ item.quantity }}</p>
        </div>
        <button (click)="removeFromCart(item.bike.id)" class="remove-button">
          Remove
        </button>
      </div>

      <div class="cart-summary">
        <h3>Total: {{ total | currency }}</h3>
        <button (click)="checkout()" class="checkout-button">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>
</div>
