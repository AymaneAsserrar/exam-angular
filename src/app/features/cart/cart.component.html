<div class="cart-overlay" (click)="closeCart()">
  <div class="cart-sidebar" (click)="$event.stopPropagation()">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-button" (click)="closeCart()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <p>Your cart is currently empty.</p>
      <button (click)="closeCart()" class="button" style="margin-top: 20px">
        Continue Shopping
      </button>
    </div>

    <div *ngIf="cartItems.length > 0">
      <div *ngFor="let item of cartItems" class="cart-item">
        <div class="cart-item-info">
          <h3>{{ item.product.name }}</h3>
          <p>Price: {{ item.product.price | currency }}</p>
          <p>Quantity: {{ item.quantity }}</p>
        </div>
        <button
          (click)="removeFromCart(item.product.name)"
          class="remove-button"
        >
          Remove
        </button>
      </div>

      <div class="cart-summary">
        <h3>Total: {{ total | currency }}</h3>
        <button (click)="checkout()" class="checkout-button">
          Proceed to Checkout
        </button>
      </div>
    </div>
  </div>
</div>
