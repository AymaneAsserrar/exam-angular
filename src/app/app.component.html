<header>
  <div class="header-content">
    <h1>Bike Shop</h1>
    <nav>
      <ul>
        <li><a routerLink="/catalog" routerLinkActive="active">Catalog</a></li>
        <li>
          <button (click)="openCart()" class="nav-button">
            Cart <span class="badge">{{ cartCount$ | async }}</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <router-outlet></router-outlet>
</main>
<app-cart *ngIf="isCartOpen$ | async"></app-cart>
<footer>
  <p>&copy; 2026 Bike Shop. All rights reserved.</p>
</footer>
