<header>
  <div class="header-content">
    <h1>Bike Shop</h1>
    <nav>
      <ul>
        <li>
          <a routerLink="/catalog" fragment="home" routerLinkActive="active"
            >Home</a
          >
        </li>
        <li>
          <a routerLink="/catalog" fragment="bikes" routerLinkActive="active"
            >Bikes</a
          >
        </li>
        <li>
          <a
            routerLink="/catalog"
            fragment="accessories"
            routerLinkActive="active"
            >Accessories</a
          >
        </li>
        <li>
          <a routerLink="/catalog" fragment="contact" routerLinkActive="active"
            >Contact</a
          >
        </li>
        <li>
          <button (click)="openCart()" class="nav-button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="feather feather-shopping-cart"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span class="badge">{{ cartCount$ | async }}</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <router-outlet></router-outlet>
</main>
<app-cart *ngIf="isCartOpen$ | async"></app-cart>
<app-footer></app-footer>
